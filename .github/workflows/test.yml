name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input — the action reads packageManager from
      # package.json (passing both used to hard-fail on any mismatch).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit, Integration & DB Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major as production (docker-compose.yml) — CI used to test
        # against 15 while prod ran 16.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/api db:generate

      - name: Run API unit + integration tests (with coverage thresholds)
        run: pnpm --filter @taskflow/api test:coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/taskflow_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-value-at-least-32-chars
          JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-32-chars!
          NODE_ENV: test

      - name: Migrate the CI database
        run: pnpm --filter @taskflow/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/taskflow_test

      - name: Run DB-backed tests (real Postgres, no mocks)
        run: pnpm --filter @taskflow/api test:db
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/taskflow_test

      - name: Run web tests (with coverage thresholds)
        run: pnpm --filter @taskflow/web test:coverage

      # Informational: the remaining high advisories are transitive deps whose
      # fixes require MAJOR upgrades of vite/vitest/react-router/turbo — tracked
      # as planned migrations. Runtime-dependency advisories are pinned via
      # pnpm.overrides in package.json and covered by the test suites.
      - name: Security audit (informational)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            packages/api/coverage/
            packages/web/coverage/

  docker-build:
    name: Docker Images Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfiles were previously exercised by no automation at all —
      # a broken build was only discovered during a production upgrade.
      - name: Build API image
        run: docker build -f packages/api/Dockerfile -t taskflow/api:ci .

      - name: Build web image
        run: docker build -f packages/web/Dockerfile -t taskflow/web:ci .

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO (attachment specs exercise real object storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          timeout 30 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

      - name: Install Playwright browsers
        run: pnpm --filter @taskflow/e2e exec playwright install chromium --with-deps

      - name: Generate Prisma client and migrate
        run: |
          pnpm --filter @taskflow/api db:generate
          pnpm --filter @taskflow/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow

      - name: Build
        run: pnpm build

      - name: Start API server
        run: pnpm --filter @taskflow/api start &
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-test-jwt-secret-value-at-least-32-chars
          JWT_REFRESH_SECRET: e2e-test-refresh-secret-must-be-32-chars!!
          NODE_ENV: test
          API_PORT: 3001
          CORS_ORIGIN: http://localhost:31779
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          # admin.spec.ts registers this address and expects it to come out an
          # administrator — that IS the bootstrap path under test.
          ADMIN_EMAILS: e2e-admin@taskflow.test

      - name: Wait for API to be ready
        run: |
          until curl -f http://localhost:3001/health; do sleep 2; done
        timeout-minutes: 1

      # The dev server, not `vite preview`: preview has no /api or /socket.io
      # proxy, so realtime and same-origin API calls only work in dev mode.
      - name: Start web server
        run: pnpm --filter @taskflow/web dev &

      - name: Wait for web to be ready
        run: |
          until curl -f http://localhost:31779; do sleep 2; done
        timeout-minutes: 1

      - name: Run E2E tests
        run: pnpm --filter @taskflow/e2e test
        env:
          E2E_BASE_URL: http://localhost:31779
          E2E_API_URL: http://localhost:3001

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
