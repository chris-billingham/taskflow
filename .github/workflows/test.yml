name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/api db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/taskflow_test

      - name: Run API unit tests
        run: pnpm --filter @taskflow/api test:unit
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/taskflow_test
          JWT_SECRET: ci-test-jwt-secret-value-at-least-32-chars
          JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-32-chars!
          NODE_ENV: test

      - name: Run API integration tests
        run: pnpm --filter @taskflow/api test:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/taskflow_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-value-at-least-32-chars
          JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-32-chars!
          NODE_ENV: test

      - name: Run web unit tests
        run: pnpm --filter @taskflow/web test:unit

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            packages/api/coverage/
            packages/web/coverage/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter @taskflow/e2e exec playwright install chromium --with-deps

      - name: Generate Prisma client and migrate
        run: |
          pnpm --filter @taskflow/api db:generate
          pnpm --filter @taskflow/api db:migrate
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow

      - name: Build API and web
        run: pnpm build
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow

      - name: Start API server
        run: pnpm --filter @taskflow/api start &
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-test-jwt-secret-value-at-least-32-chars
          JWT_REFRESH_SECRET: e2e-test-refresh-secret-must-be-32-chars!!
          NODE_ENV: production
          API_PORT: 3001

      - name: Wait for API to be ready
        run: |
          until curl -f http://localhost:3001/health; do sleep 2; done
        timeout-minutes: 1

      - name: Start web server
        run: pnpm --filter @taskflow/web preview --port 5173 &

      - name: Wait for web to be ready
        run: |
          until curl -f http://localhost:5173; do sleep 2; done
        timeout-minutes: 1

      - name: Run E2E tests
        run: pnpm --filter @taskflow/e2e test
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3001

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
