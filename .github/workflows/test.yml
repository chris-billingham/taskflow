name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The dev-only Garage secret from docker-compose.dev.yml (not a real credential).
env:
  DEV_S3_SECRET: a61e5c5683e8712af4b0934445b3e31d3c367aeda7e6ac6334474ffa1af7a6f7

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same pull request supersedes the running check. Pushes
# to main always run to completion so every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input — the action reads packageManager from
      # package.json (passing both used to hard-fail on any mismatch).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  openapi:
    name: API Document
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/api db:generate

      # openapi.json is generated from the route schemas and committed, so a
      # route change shows up in review and the Swift client builds from it.
      - name: Check openapi.json is current
        run: |
          pnpm --filter @taskflow/api openapi:export
          git diff --exit-code openapi.json || {
            echo "::error file=openapi.json::openapi.json is out of date. Run 'pnpm --filter @taskflow/api openapi:export' and commit the result."
            exit 1
          }

      # Installed apps keep running old versions, so removing a route or a
      # response field breaks them. Put [api-break] in the commit message or
      # pull request title when that's intended.
      - name: Check for breaking API changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OVERRIDE: ${{ contains(format('{0} {1}', github.event.head_commit.message, github.event.pull_request.title), '[api-break]') }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No earlier commit to compare with."; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if ! git show "$BASE:openapi.json" > "$RUNNER_TEMP/base.json" 2>/dev/null; then
            echo "The earlier commit has no openapi.json."; exit 0
          fi
          cp openapi.json "$RUNNER_TEMP/head.json"
          docker run --rm -v "$RUNNER_TEMP:/w" -w /w \
            tufin/oasdiff@sha256:8e6abebf4ad2e95e904a56c14825bb4338e185e7a4be4e3cf1b86d31162dfcdd \
            breaking base.json head.json --fail-on ERR || {
              if [ "$OVERRIDE" = "true" ]; then echo "::warning::Breaking API change allowed by [api-break]."; exit 0; fi
              echo "::error file=openapi.json::This change would break installed apps. See the list above."
              exit 1
            }

  swift-client:
    name: Swift Client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2-noble
    defaults:
      run:
        working-directory: clients/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/swift/.build
          key: swift-${{ hashFiles('clients/swift/Package.resolved') }}

      # Generates the client from openapi.json and decodes canned responses
      # shaped like the API's real ones.
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  unit-tests:
    name: Unit, Integration & DB Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same major as production (docker-compose.yml) — CI used to test
        # against 15 while prod ran 16.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taskflow/api db:generate

      # The API and web app import the compiled contract package.
      - name: Build contract
        run: pnpm --filter @taskflow/contract build

      - name: Migrate the CI database
        run: pnpm --filter @taskflow/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/taskflow_test

      # Unit, integration and DB-backed suites in one run, so coverage counts
      # the service code the real-database tests exercise.
      - name: Run API tests (unit, integration, DB) with coverage thresholds
        run: pnpm --filter @taskflow/api test:coverage:all
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/taskflow_test
          REDIS_URL: redis://localhost:6379

      - name: Run web tests (with coverage thresholds)
        run: pnpm --filter @taskflow/web test:coverage

      # Informational: the remaining high advisories are transitive deps whose
      # fixes require MAJOR upgrades of vite/vitest/react-router/turbo — tracked
      # as planned migrations. Runtime-dependency advisories are pinned via
      # pnpm.overrides in package.json and covered by the test suites.
      # Gating: anything high or critical in what actually ships fails the build.
      - name: Security audit (production deps)
        run: pnpm audit --prod --audit-level=high

      # Dev tooling too: build and test tools run in CI with the repo's secrets.
      - name: Security audit (all deps)
        run: pnpm audit --audit-level=high

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-reports
          path: |
            packages/api/coverage/
            packages/web/coverage/

  # Builds the release images and runs them the way an install does: Traefik
  # on https://localhost, the migrate one-shot, Garage, api, worker and web,
  # with freshly generated secrets. The end-to-end suite then runs against
  # that stack. Most past production bugs were "the code is right, the
  # container never gets the value" — only booting the real stack finds those.
  production-stack:
    name: Production Stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @taskflow/e2e exec playwright install chromium --with-deps

      - name: Build and boot the production stack
        run: bash scripts/ci/prod-stack.sh up

      - name: Run E2E tests against it
        run: pnpm --filter @taskflow/e2e test
        env:
          E2E_BASE_URL: https://localhost
          E2E_API_URL: https://localhost

      - name: Container logs
        if: failure()
        run: bash scripts/ci/prod-stack.sh logs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-production-stack
          path: packages/e2e/playwright-report/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-typecheck, unit-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same image, config and dev key as docker-compose.dev.yml.
      - name: Start Garage (attachment specs exercise real object storage)
        run: |
          docker run -d --name garage -p 9000:3900 -p 3903:3903 \
            -v "$PWD/docker/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -e GARAGE_DEFAULT_ACCESS_KEY=GK000000000000000000000001 \
            -e GARAGE_DEFAULT_SECRET_KEY=${{ env.DEV_S3_SECRET }} \
            -e GARAGE_DEFAULT_BUCKET=taskflow \
            dxflrs/garage:v2.4.1 /garage server --single-node --default-bucket
          timeout 30 sh -c 'until curl -sf http://localhost:3903/health; do sleep 1; done'

      - name: Install Playwright browsers
        run: pnpm --filter @taskflow/e2e exec playwright install chromium --with-deps

      - name: Generate Prisma client and migrate
        run: |
          pnpm --filter @taskflow/api db:generate
          pnpm --filter @taskflow/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow

      - name: Build
        run: pnpm build

      - name: Start API server
        run: pnpm --filter @taskflow/api start &
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-test-jwt-secret-value-at-least-32-chars
          JWT_REFRESH_SECRET: e2e-test-refresh-secret-must-be-32-chars!!
          NODE_ENV: test
          API_PORT: 3001
          CORS_ORIGIN: http://localhost:31779
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: GK000000000000000000000001
          S3_SECRET_KEY: ${{ env.DEV_S3_SECRET }}
          # admin.spec.ts registers this address and expects it to come out an
          # administrator — that IS the bootstrap path under test.
          ADMIN_EMAILS: e2e-admin@taskflow.test
          # The suite registers its own users; invite-only is covered by the
          # API's database tests.
          REGISTRATION_MODE: open

      - name: Wait for API to be ready
        run: |
          until curl -f http://localhost:3001/health; do sleep 2; done
        timeout-minutes: 1

      # The dev server, not `vite preview`: preview has no /api or /socket.io
      # proxy, so realtime and same-origin API calls only work in dev mode.
      - name: Start web server
        run: pnpm --filter @taskflow/web dev &

      - name: Wait for web to be ready
        run: |
          until curl -f http://localhost:31779; do sleep 2; done
        timeout-minutes: 1

      - name: Run E2E tests
        run: pnpm --filter @taskflow/e2e test
        env:
          E2E_BASE_URL: http://localhost:31779
          E2E_API_URL: http://localhost:3001

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
