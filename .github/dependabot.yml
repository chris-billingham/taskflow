# Weekly dependency updates, so upgrades arrive as small tested PRs instead of
# piling up behind security overrides. Minor and patch bumps are grouped into
# one PR per ecosystem; each major version gets its own PR to review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    ignore:
      # v6 bootstraps pnpm 11 before switching to the pinned version; revisit
      # together with the next pnpm major.
      - dependency-name: pnpm/action-setup
        update-types: ['version-update:semver-major']

  # Base images in the Dockerfiles (node, nginx).
  - package-ecosystem: docker
    directories:
      - /packages/api
      - /packages/web
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Stay on the current Node LTS line (see .nvmrc); move majors on purpose.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Service images in docker-compose.yml (postgres, redis, garage, traefik, rclone).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # A new Postgres major can't start on the old data directory; it needs
      # a dump/restore or pg_upgrade path, not a tag bump.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      # Redis majors change persistence formats and licensing; move on purpose.
      - dependency-name: redis
        update-types: ['version-update:semver-major']
