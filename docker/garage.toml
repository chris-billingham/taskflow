# Garage (S3-compatible object storage) for the bundled single-node setup.
# Secrets are NOT in this file: the RPC secret and the S3 key come from the
# environment (see docker-compose*.yml), and `garage server --single-node
# --default-bucket` creates the layout, key and bucket on first start.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# SQLite survives an unclean shutdown better than LMDB; throughput is ample
# for a small team's attachments.
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Must match the API's S3_REGION (its default is us-east-1).
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
# Serves the unauthenticated /health endpoint used by healthchecks.
api_bind_addr = "[::]:3903"
