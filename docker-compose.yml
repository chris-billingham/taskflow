# Bounded container logs: without this the json-file driver grows unbounded
# and eventually fills the host disk (Traefik access logs + API JSON logs).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 60 1
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m

  minio:
    # Pinned: :latest jumped MinIO majors (breaking auth/console changes)
    # silently on every upgrade rebuild.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taskflow-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # MinIO console (port 9001) is intentionally NOT exposed via Traefik.
    # Access it via `docker compose port minio 9001` or an SSH tunnel.

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: ${DOCKER_REGISTRY:-taskflow}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: https://${DOMAIN}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-taskflow}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-taskflow-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      # Instance administrators. Without this the ADMIN_EMAILS in .env never
      # reached the container, so no account could ever hold the ADMIN role and
      # the admin console was unreachable on every production install.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Public base URL used for links in email. Defaults to the app origin.
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      # SMTP. Also previously absent here, so configuring it in .env silently
      # did nothing: no verification, invite, reset or digest mail was ever
      # sent, and — with no admin either — a forgotten password was unrecoverable.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@${DOMAIN}}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      # API router matches /api, /health, and /socket.io paths — higher Traefik priority than web router
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/socket.io`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=3001
      # HSTS lives at the TLS terminator (only Traefik knows the request was HTTPS)
      - traefik.http.middlewares.hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true
      - traefik.http.routers.api.middlewares=hsts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      # NOTE: only deploy.resources is honoured by non-swarm docker compose;
      # restart behaviour comes from `restart: unless-stopped` above.
      resources:
        limits:
          cpus: "1"
          memory: 512m

  worker:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: ${DOCKER_REGISTRY:-taskflow}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "dist/worker-entry.js"]
    healthcheck:
      # Process-liveness: the worker exposes no port; a wedged event loop is
      # caught because node can't spawn the probe once it deadlocks hard.
      test: ["CMD-SHELL", "pgrep -f worker-entry || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-taskflow}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-taskflow-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      # The worker sends the reminder, digest, due-soon and overdue emails, so
      # it needs the SMTP settings and the app origin for links in them just as
      # much as the API does.
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      CORS_ORIGIN: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@${DOMAIN}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    image: ${DOCKER_REGISTRY:-taskflow}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    networks:
      - traefik
    labels:
      - traefik.enable=true
      # Web router is catch-all for the domain
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=80
      - traefik.http.routers.web.middlewares=hsts
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

networks:
  traefik:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  letsencrypt:
