# Images are the published releases: TASKFLOW_VERSION in .env picks one
# (scripts/upgrade.sh sets it). `build:` remains so the same file can build
# from a checkout instead (TASKFLOW_VERSION=local, see scripts/upgrade.sh --build).
#
# Bounded container logs: without this the json-file driver grows unbounded
# and eventually fills the host disk (Traefik access logs + API JSON logs).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    logging: *default-logging
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 60 1
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m

  garage:
    # S3-compatible object storage for attachments. Replaces MinIO, whose
    # images were withdrawn from Docker Hub and quay.io (the project was
    # archived in 2026), so fresh installs could not start at all.
    # `--single-node --default-bucket` creates the layout, the S3 key and the
    # bucket from the GARAGE_DEFAULT_* variables on first start; later starts
    # leave them as they are.
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    logging: *default-logging
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-taskflow}
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      # The image is a single static binary (no shell, curl or wget).
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Not exposed via Traefik: only the API and worker talk to storage, and
    # downloads are streamed through the API.

  # One-shot S3 client for scripts/backup.sh and scripts/restore.sh (the
  # Garage image has no tools of its own). Never started by `up`.
  rclone:
    image: rclone/rclone:1.75.1
    profiles: ["tools"]
    environment:
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: Other
      RCLONE_CONFIG_STORE_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_STORE_REGION: us-east-1
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    networks:
      - internal

  # Applies pending database migrations, then exits. api and worker wait for
  # it to succeed, so a plain `docker compose up` after pulling new code can
  # never run that code against an old schema.
  migrate:
    image: ${TASKFLOW_REGISTRY:-ghcr.io/chris-billingham}/taskflow-api:${TASKFLOW_VERSION:-latest}
    restart: "no"
    logging: *default-logging
    # The image's own Prisma CLI, called directly: npx would route through npm
    # (update notices, and a registry lookup if the binary were ever missing).
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      args:
        TASKFLOW_VERSION: ${TASKFLOW_BUILD_VERSION:-local}
        TASKFLOW_COMMIT: ${TASKFLOW_BUILD_COMMIT:-}
    image: ${TASKFLOW_REGISTRY:-ghcr.io/chris-billingham}/taskflow-api:${TASKFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: https://${DOMAIN}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_BUCKET: ${S3_BUCKET:-taskflow}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      # Instance administrators. Without this the ADMIN_EMAILS in .env never
      # reached the container, so no account could ever hold the ADMIN role and
      # the admin console was unreachable on every production install.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Public base URL used for links in email. Defaults to the app origin.
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      # SMTP. Also previously absent here, so configuring it in .env silently
      # did nothing: no verification, invite, reset or digest mail was ever
      # sent, and — with no admin either — a forgotten password was unrecoverable.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@${DOMAIN}}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      TRUST_PROXY_ADDRS: ${TRUST_PROXY_ADDRS:-loopback,linklocal,uniquelocal}
      RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Single sign-on (OpenID Connect); see docs/admin-guide/single-sign-on.md.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-single sign-on}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      # API router matches /api, /health, and /socket.io paths — higher Traefik priority than web router
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/socket.io`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=3001
      # HSTS lives at the TLS terminator (only Traefik knows the request was HTTPS)
      - traefik.http.middlewares.hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true
      - traefik.http.routers.api.middlewares=hsts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      # NOTE: only deploy.resources is honoured by non-swarm docker compose;
      # restart behaviour comes from `restart: unless-stopped` above.
      resources:
        limits:
          cpus: "1"
          memory: 512m

  worker:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      args:
        TASKFLOW_VERSION: ${TASKFLOW_BUILD_VERSION:-local}
        TASKFLOW_COMMIT: ${TASKFLOW_BUILD_COMMIT:-}
    image: ${TASKFLOW_REGISTRY:-ghcr.io/chris-billingham}/taskflow-api:${TASKFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "dist/worker-entry.js"]
    healthcheck:
      # The worker touches this file every 15 seconds, after recording its
      # heartbeat in Redis; a stale file means jobs aren't running (Redis lost,
      # event loop stuck, or the process gone).
      test: ["CMD-SHELL", "[ -n \"$$(find /tmp/taskflow-worker-heartbeat -mmin -1 2>/dev/null)\" ]"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_BUCKET: ${S3_BUCKET:-taskflow}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      # The worker sends the reminder, digest, due-soon and overdue emails, so
      # it needs the SMTP settings and the app origin for links in them just as
      # much as the API does.
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      CORS_ORIGIN: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@${DOMAIN}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # History kept, in days (0 = forever); the nightly cleanup runs here.
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-365}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    image: ${TASKFLOW_REGISTRY:-ghcr.io/chris-billingham}/taskflow-web:${TASKFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    networks:
      - traefik
    labels:
      - traefik.enable=true
      # Web router is catch-all for the domain
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=8080
      - traefik.http.routers.web.middlewares=hsts
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

networks:
  traefik:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
  letsencrypt:
