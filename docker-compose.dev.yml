services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    ports:
      # Loopback only: exposing an unauthenticated dev DB on 0.0.0.0 hands
      # full read/write to anyone on the same network.
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: taskflow-garage
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    ports:
      - '127.0.0.1:9000:3900'
    environment:
      # Fixed dev-only credentials (loopback-bound). packages/api/.env.example
      # and the API's non-production defaults use the same values.
      GARAGE_RPC_SECRET: 67f5a26c307b8734b51fb9ad52b771ca5b3e688e0aac916aeebd33b8738f0d31
      GARAGE_DEFAULT_ACCESS_KEY: GK000000000000000000000001
      GARAGE_DEFAULT_SECRET_KEY: a61e5c5683e8712af4b0934445b3e31d3c367aeda7e6ac6334474ffa1af7a6f7
      GARAGE_DEFAULT_BUCKET: taskflow
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
