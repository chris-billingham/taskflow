# Security headers, included in the server block AND in every location that
# declares its own add_header. nginx's add_header is NOT inherited into a
# location that sets any header of its own — before this snippet existed, the
# asset and SPA locations (which add Cache-Control) shipped with ZERO security
# headers in production.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# blob: in img-src is required for attachment previews (fetched as authed blobs);
# 'unsafe-inline' styles for React inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
